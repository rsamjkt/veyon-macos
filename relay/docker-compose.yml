# Aruni Relay on a VPS: Caddy terminates TLS (automatic Let's Encrypt) and
# forwards WebSocket traffic to the relay. Point the DNS name in RELAY_DOMAIN
# (e.g. relay.arunihealth.id) at the VPS, then: docker compose up -d
services:
  relay:
    image: ghcr.io/rsamjkt/aruni-relay:latest
    build: .
    restart: unless-stopped
    volumes:
      - relay-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.arunihealth.id}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - relay

volumes:
  relay-data:
  caddy-data:
