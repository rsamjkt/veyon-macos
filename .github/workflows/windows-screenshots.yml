name: Windows screenshots (website)

# Installs the released Windows setup on a fresh runner, starts the
# Configurator and the Master and captures their windows for the download
# website (website/public/img/windows-*.png).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.2.0

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - name: Download installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ inputs.tag }} --repo ${{ github.repository }} --pattern "*Setup*.exe" --output setup.exe

      - name: Install
        run: |
          Start-Process -FilePath .\setup.exe -ArgumentList '/S' -Wait
          Get-ChildItem "$env:ProgramFiles\AruniControl" | Select-Object -First 20

      # sample setup so the Master opens straight to a room instead of a logon prompt
      - name: Configure
        run: |
          $cli = "$env:ProgramFiles\AruniControl\veyon-wcli.exe"
          & $cli authkeys create sekolah
          & $cli config set Authentication/Method 1
          & $cli config set NetworkObjectDirectory/Plugin "{14bacaaa-ebe5-449c-b881-5b382f952571}"
          & $cli networkobjects add location "Lab Komputer 1"
          & $cli networkobjects add computer "PC-GURU" localhost "" "Lab Komputer 1"
          & $cli networkobjects add computer "PC-01" 10.0.0.101 "" "Lab Komputer 1"
          & $cli networkobjects add computer "PC-02" 10.0.0.102 "" "Lab Komputer 1"
          & $cli service restart
          & $cli networkobjects list
          & $cli config get Authentication/Method
          & $cli config get NetworkObjectDirectory/Plugin
          reg query "HKLM\SOFTWARE\Arunika" /s | Select-Object -First 40

      - name: Capture
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class W {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int hh, bool r);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
          }
          "@
          $dir = "$env:ProgramFiles\AruniControl"
          New-Item -ItemType Directory -Force shots | Out-Null
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "screen $($bounds.Width)x$($bounds.Height)"

          function Shot($proc, $name) {
            $h = $proc.MainWindowHandle
            [W]::ShowWindow($h, 1) | Out-Null
            [W]::SetForegroundWindow($h) | Out-Null
            Start-Sleep 2
            $r = New-Object W+RECT
            [W]::GetWindowRect($h, [ref]$r) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.R - $r.L), ($r.B - $r.T)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("shots\$name.png")
            Write-Host "saved $name $($bmp.Width)x$($bmp.Height)"
          }

          function WaitWindow($proc) {
            for ($i = 0; $i -lt 60 -and $proc.MainWindowHandle -eq 0; $i++) { Start-Sleep 1; $proc.Refresh() }
          }

          function SelectPage($proc, $title) {
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($proc.MainWindowHandle)
            $cond = New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::NameProperty), $title
            $item = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
            if ($item -eq $null) { Write-Host "page '$title' not found"; return $false }
            # a real click, so Qt switches the page and not only the highlight
            $r = $item.Current.BoundingRectangle
            [W]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2)) | Out-Null
            [W]::mouse_event(2, 0, 0, 0, 0); [W]::mouse_event(4, 0, 0, 0, 0)
            [W]::SetCursorPos(990, 760) | Out-Null
            Start-Sleep 2
            return $true
          }

          $env:VEYON_CONFIGURATOR_NO_ELEVATION = '1'
          $conf = Start-Process "$dir\veyon-configurator.exe" -PassThru
          WaitWindow $conf
          [W]::MoveWindow($conf.MainWindowHandle, 0, 0, 1000, 720, $true) | Out-Null
          Start-Sleep 3
          Shot $conf "windows-configurator"
          foreach ($page in @("Aruni Gateway", "Service", "Authentication keys", "Locations & computers")) {
            if (SelectPage $conf $page) { Shot $conf ("windows-configurator-" + (($page -split ' ')[0]).ToLower() + $(if ($page -eq "Aruni Gateway") { "-gateway" } else { "" })) }
          }
          Stop-Process $conf

          $master = Start-Process "$dir\veyon-master.exe" -PassThru
          WaitWindow $master
          [W]::MoveWindow($master.MainWindowHandle, 0, 0, 1000, 720, $true) | Out-Null
          Start-Sleep 15
          Shot $master "windows-master"
          Stop-Process $master

          # full desktop, for debugging when a window capture came out wrong
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size)
          $bmp.Save("shots\windows-desktop.png")

      # artifact storage is often full - hand the images over through a
      # draft release instead (delete it after downloading)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-screenshots --repo ${{ github.repository }} --yes 2>$null
          gh release create ci-screenshots --repo ${{ github.repository }} --draft --title "CI screenshots" --notes "temporary" (Get-ChildItem shots\*.png).FullName
