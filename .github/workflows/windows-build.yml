name: Windows build (AruniControl)

# Builds the Windows AruniControl Server + tools + add-ons (Application
# Monitoring, AruniMedia, Internet Access Control, Chat, Network Discovery)
# natively with the MSYS2 mingw-w64 toolchain — the same compiler family Veyon
# uses upstream (MXE). Produces a self-contained folder, uploaded as an artifact.

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/**'
      - 'core/**'
      - 'server/**'
      - 'service/**'
      - 'worker/**'
      - 'cli/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/windows-build.yml'
    # pushing a version tag builds the release and attaches the assets to it
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  APP_VERSION: 1.5.0
  APP_CODENAME: Fiona

permissions:
  contents: write   # allow uploading assets to the release

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            unzip
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qca-qt6
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-nsis

      - name: Vendor the Interception SDK (needed by windows-platform)
        run: |
          set -e
          curl -L -o /tmp/interception.zip \
            https://github.com/oblitum/Interception/releases/download/v1.0.1/Interception.zip
          mkdir -p /tmp/interception && cd /tmp/interception
          unzip -o /tmp/interception.zip
          HDR=$(find . -name 'interception.h' | head -1)
          DLL=$(find . -ipath '*x64*' -name 'interception.dll' | head -1)
          echo "header=$HDR  dll=$DLL"
          cp "$HDR" /mingw64/include/
          cd "$(dirname "$DLL")"
          gendef interception.dll
          dlltool -d interception.def -D interception.dll -l /mingw64/lib/libinterception.a
          cp interception.dll "$GITHUB_WORKSPACE/interception.dll"

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_WEBAPI=OFF \
            -DWITH_TRANSLATIONS=ON \
            -DWITH_TESTS=OFF \
            -DWITH_LTO=OFF \
            -DWITH_PCH=OFF \
            -DWITH_UNITY_BUILD=OFF \
            -DVEYON_ARUNICONTROL_SKIP_LDAP=ON

      - name: Build
        # -k 0: keep going after errors so a single run surfaces every failure
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel -- -k 0

      - name: Package (windeployqt + dependency walk)
        run: |
          set -e
          STAGE="$GITHUB_WORKSPACE/AruniControl-Server-win64"
          rm -rf "$STAGE"; mkdir -p "$STAGE/plugins"

          # executables + core library
          find build -maxdepth 2 -name 'veyon-*.exe' -exec cp {} "$STAGE/" \;
          cp build/core/veyon-core.dll "$STAGE/"

          # LibVNCServer/LibVNCClient are built from 3rdparty/ since 4.11
          # (-DWITH_BUNDLED_LIBVNC=ON) and land outside build/core, so the two
          # DLLs have to be picked up explicitly - veyon-core.dll links them.
          find build/3rdparty -name '*.dll' -exec cp {} "$STAGE/" \; 2>/dev/null || true

          # plugins: real plugin modules into plugins/, helper libs to the root
          find build/plugins -name '*.dll' -exec cp {} "$STAGE/plugins/" \;
          # user interface translations (Indonesian is the default language)
          mkdir -p "$STAGE/translations"
          find build/translations -name '*.qm' -exec cp {} "$STAGE/translations/" \;
          ( cd "$STAGE/plugins" && for f in lib*.dll; do [ -e "$f" ] && mv "$f" "$STAGE/"; done; true )

          # vendored interception runtime
          cp "$GITHUB_WORKSPACE/interception.dll" "$STAGE/" || true

          # QCA library + crypto provider (the ossl provider is REQUIRED for RSA
          # key authentication). Locate both robustly — MSYS2 paths differ from MXE.
          find /mingw64 -iname 'libqca-qt6*.dll' -exec cp {} "$STAGE/" \; 2>/dev/null || true
          mkdir -p "$STAGE/crypto"
          echo "--- searching for QCA crypto providers under /mingw64 ---"
          find /mingw64 -iname 'libqca-ossl*.dll' -print -exec cp {} "$STAGE/crypto/" \; 2>/dev/null || true
          find /mingw64 -ipath '*qca-qt6/crypto*' -iname '*.dll' -print -exec cp {} "$STAGE/crypto/" \; 2>/dev/null || true
          find /mingw64 -ipath '*plugins/crypto*' -iname '*.dll' -print -exec cp {} "$STAGE/crypto/" \; 2>/dev/null || true
          if [ -z "$(ls -A "$STAGE/crypto" 2>/dev/null)" ]; then
            echo "::error::QCA crypto provider (libqca-ossl) not found — RSA auth would fail"
            echo "--- full QCA file listing for diagnosis ---"
            find /mingw64 -iname '*qca*' -o -iname '*ossl*' | grep -i qca || true
            exit 1
          fi
          echo "--- bundled crypto providers ---"; ls -la "$STAGE/crypto"

          # Qt Multimedia backend plugin (needed by AruniVoice's QAudioSource/Sink).
          # windeployqt does not see Multimedia because only the plugin links it.
          mkdir -p "$STAGE/multimedia"
          find /mingw64 -ipath '*plugins/multimedia*' -iname '*.dll' -print -exec cp {} "$STAGE/multimedia/" \; 2>/dev/null || true
          echo "--- bundled multimedia backends ---"; ls -la "$STAGE/multimedia" || true

          # Qt runtime + Qt plugins (platforms/tls/imageformats/styles)
          cd "$STAGE"
          for exe in veyon-master.exe veyon-server.exe veyon-configurator.exe veyon-cli.exe veyon-worker.exe veyon-service.exe; do
            [ -e "$exe" ] && windeployqt6 --release --no-translations --no-opengl-sw --compiler-runtime "$exe" || true
          done

          # copy every remaining /mingw64 DLL dependency (openssl, lzo, jpeg, png,
          # zlib, gcc/pthread runtime, …); fixpoint over several passes
          for pass in 1 2 3 4 5; do
            for f in "$STAGE"/*.exe "$STAGE"/*.dll "$STAGE"/plugins/*.dll "$STAGE"/crypto/*.dll "$STAGE"/multimedia/*.dll; do
              [ -e "$f" ] || continue
              ldd "$f" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^\/mingw64\//) print $i}' | while read -r dep; do
                base=$(basename "$dep")
                [ -e "$STAGE/$base" ] || cp "$dep" "$STAGE/"
              done
            done
          done

          cp "$GITHUB_WORKSPACE/COPYING" "$STAGE/LICENSE.txt" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/README.macos.md" "$STAGE/README.txt" 2>/dev/null || true
          echo "--- staged file count ---"; find "$STAGE" -type f | wc -l
          ls -la "$STAGE"

      - name: Upload artifact (folder)
        uses: actions/upload-artifact@v4
        # a full artifact quota must not block the installer and the release upload
        continue-on-error: true
        with:
          name: AruniControl-Server-win64
          path: AruniControl-Server-win64
          if-no-files-found: error
          # releases get their assets attached directly; CI artifacts only need to
          # live long enough to be tested (the account's artifact quota is small)
          retention-days: 7

      - name: Build one-click installer (NSIS)
        run: |
          set -e
          STAGE="$GITHUB_WORKSPACE/AruniControl-Server-win64"
          OUT="$GITHUB_WORKSPACE/AruniControl-Setup-${{ env.APP_VERSION }}-${{ env.APP_CODENAME }}-Windows-x64.exe"
          makensis \
            -DSRC="$(cygpath -w "$STAGE")" \
            -DICON="$(cygpath -w "$GITHUB_WORKSPACE/nsis/installer.ico")" \
            -DOUTFILE="$(cygpath -w "$OUT")" \
            -DVERSION=${{ env.APP_VERSION }} \
            "$GITHUB_WORKSPACE/nsis/aruni-installer.nsi"
          ls -lh "$OUT"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        # a full artifact quota must not block the installer and the release upload
        continue-on-error: true
        with:
          name: AruniControl-Setup-win64
          path: AruniControl-Setup-${{ env.APP_VERSION }}-${{ env.APP_CODENAME }}-Windows-x64.exe
          if-no-files-found: error
          # releases get their assets attached directly; CI artifacts only need to
          # live long enough to be tested (the account's artifact quota is small)
          retention-days: 7

      # Publish the Windows assets to the release directly from the runner
      # (fast GitHub-internal network) so large files don't have to be moved
      # through a slow local connection. Only version tags publish - builds of
      # main used to overwrite the assets of an already published release.
      - name: Publish Windows assets to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path AruniControl-Server-win64\* `
            -DestinationPath AruniControl-Server-${{ env.APP_VERSION }}-${{ env.APP_CODENAME }}-Windows-x64.zip -Force
          gh release upload ${{ github.ref_name }} `
            AruniControl-Setup-${{ env.APP_VERSION }}-${{ env.APP_CODENAME }}-Windows-x64.exe `
            AruniControl-Server-${{ env.APP_VERSION }}-${{ env.APP_CODENAME }}-Windows-x64.zip `
            --clobber --repo $env:GITHUB_REPOSITORY
