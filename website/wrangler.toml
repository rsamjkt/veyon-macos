# Website unduhan resmi AruniControl (Cloudflare Workers + static assets).
#
#   npx wrangler deploy
#
# Halaman statis ada di public/, file installer ada di bucket R2
# "arunicontrol-unduhan" dengan pola <tag>/<nama file> (lihat src/worker.js).

name = "arunicontrol"
main = "src/worker.js"
# keep the workers.dev address: installed versions check it for updates
workers_dev = true
compatibility_date = "2026-05-01"

# own domain (zone arunihealth.id is on this Cloudflare account); the
# workers.dev address keeps working for existing installations
routes = [
	{ pattern = "arunicontrol.arunihealth.id", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/unduh/*", "/pasang.ps1", "/pasang.sh"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "arunicontrol-unduhan"
